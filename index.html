<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Birthday Wish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
    }

    /* Card Frame */
    .card-frame {
      width: 360px;
      height: 640px;
      background: linear-gradient(180deg, #fceae6 0%, #f7dcd5 100%);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Subtitle */
    .top-subtext {
      position: absolute;
      top: 35px;
      font-size: 0.85rem;
      color: #9e7f7b;
      font-style: italic;
      letter-spacing: 0.5px;
      z-index: 5;
    }

    /* Pull Container */
    .pull-container {
      position: absolute;
      top: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      user-select: none;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .pull-container:active {
      cursor: grabbing;
    }

    /* Initial Heart Icon */
    .heart-icon {
      width: 30px;
      height: 30px;
      background-color: #e57373;
      transform: rotate(-45deg);
      position: relative;
      box-shadow: 0 4px 10px rgba(229, 115, 115, 0.4);
    }

    .heart-icon::before,
    .heart-icon::after {
      content: "";
      width: 30px;
      height: 30px;
      background-color: #e57373;
      border-radius: 50%;
      position: absolute;
    }

    .heart-icon::before {
      top: -15px;
      left: 0;
    }

    .heart-icon::after {
      left: 15px;
      top: 0;
    }

    /* Down Arrow */
    .arrow-down {
      margin-top: 25px;
      color: #d88d8d;
      font-size: 1rem;
      animation: bounce 1.2s infinite;
    }

    .pull-text {
      margin-top: 5px;
      font-size: 0.65rem;
      color: #a87d7d;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* Birthday Wish Container */
    .wish-container {
      position: absolute;
      top: 35px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.3s;
      z-index: 5;
    }

    .wish-container.active {
      opacity: 1;
    }

    .make-a-wish {
      font-size: 0.8rem;
      color: #a3827e;
      font-style: italic;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8rem;
      color: #d32f2f;
      line-height: 1.1;
      margin-top: 5px;
      text-align: center;
    }

    .celebrate-text {
      font-size: 0.75rem;
      color: #8c6b67;
      margin-top: 5px;
    }

    /* Date Tag */
    .date-tag {
      position: absolute;
      bottom: 25px;
      font-size: 0.75rem;
      color: #b08b87;
      letter-spacing: 1px;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.8s ease 1s;
    }

    .date-tag.active {
      opacity: 1;
    }

    /* Growing Tree Container */
    .tree-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    .trunk {
      width: 4px;
      height: 0;
      background-color: #6d4c41;
      position: relative;
      transition: height 1.5s ease-in-out;
      border-radius: 2px;
    }

    .trunk.grow {
      height: 160px;
    }

    /* Heart Canopy */
    .canopy {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 220px;
      height: 200px;
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.27) 1.2s;
    }

    .canopy.bloom {
      transform: translateX(-50%) scale(1);
    }

    /* Individual Leaf Hearts */
    .leaf-heart {
      position: absolute;
      background-color: #ef5350;
      transform: rotate(-45deg);
      border-radius: 2px;
    }

    .leaf-heart::before,
    .leaf-heart::after {
      content: "";
      position: absolute;
      background-color: #ef5350;
      border-radius: 50%;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
  </style>
</head>
<body>

  <div class="card-frame">
    <div class="top-subtext" id="topSubtext">a little something, for you</div>

    <!-- Pull Down Interactive Button -->
    <div class="pull-container" id="pullContainer">
      <div class="heart-icon"></div>
      <div class="arrow-down">↓</div>
      <div class="pull-text">PULL & RELEASE</div>
    </div>

    <!-- Hidden Birthday Wish Text -->
    <div class="wish-container" id="wishContainer">
      <div class="make-a-wish">make a wish...</div>
      <h1 class="main-title">Happy<br>Birthday</h1>
      <div class="celebrate-text">to someone worth celebrating</div>
    </div>

    <!-- Growing Tree Structure -->
    <div class="tree-container">
      <div class="trunk" id="trunk">
        <div class="canopy" id="canopy"></div>
      </div>
    </div>

    <!-- Custom Birthdate -->
    <div class="date-tag" id="dateTag">here's to a year that blooms</div>
  </div>

  <script>
    const pullContainer = document.getElementById('pullContainer');
    const wishContainer = document.getElementById('wishContainer');
    const topSubtext = document.getElementById('topSubtext');
    const trunk = document.getElementById('trunk');
    const canopy = document.getElementById('canopy');
    const dateTag = document.getElementById('dateTag');

    let startY = 0;
    let isDragging = false;

    // Generate Heart Leaves for Tree Canopy
    function createTreeLeaves() {
      const colors = ['#e57373', '#ef5350', '#f44336', '#e91e63', '#ff80ab', '#ff4081'];
      const totalLeaves = 80;

      for (let i = 0; i < totalLeaves; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf-heart';
        
        // Random positioning in a heart/circle shape
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 80;
        const x = Math.cos(angle) * radius + 100;
        const y = Math.sin(angle) * (radius * 0.8) + 80;
        
        const size = Math.random() * 12 + 8;
        const color = colors[Math.floor(Math.random() * colors.length)];

        leaf.style.left = `${x}px`;
        leaf.style.top = `${y}px`;
        leaf.style.width = `${size}px`;
        leaf.style.height = `${size}px`;
        leaf.style.backgroundColor = color;

        // Custom style for pseudo elements using dynamic CSS injection
        const style = document.createElement('style');
        style.innerHTML = `
          .leaf-${i}::before, .leaf-${i}::after {
            background-color: ${color} !important;
            width: ${size}px !important;
            height: ${size}px !important;
          }
          .leaf-${i}::before { top: -${size/2}px !important; }
          .leaf-${i}::after { left: ${size/2}px !important; }
        `;
        document.head.appendChild(style);
        leaf.classList.add(`leaf-${i}`);

        canopy.appendChild(leaf);
      }
    }

    createTreeLeaves();

    // Mouse and Touch Events
    function startDrag(y) {
      isDragging = true;
      startY = y;
    }

    function moveDrag(y) {
      if (!isDragging) return;
      const deltaY = y - startY;
      if (deltaY > 0 && deltaY < 100) {
        pullContainer.style.transform = `translateY(${deltaY}px)`;
      }
    }

    function endDrag(y) {
      if (!isDragging) return;
      isDragging = false;
      const deltaY = y - startY;

      if (deltaY > 40) {
        // Trigger Animation
        pullContainer.style.opacity = '0';
        pullContainer.style.pointerEvents = 'none';
        topSubtext.style.opacity = '0';

        setTimeout(() => {
          wishContainer.classList.add('active');
          trunk.classList.add('grow');
          canopy.classList.add('bloom');
          dateTag.classList.add('active');
          dateTag.innerText = "27 • 11 • 2010"; // Your customized date
        }, 300);
      } else {
        pullContainer.style.transform = `translateY(0px)`;
      }
    }

    // Mouse Events
    pullContainer.addEventListener('mousedown', (e) => startDrag(e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
    window.addEventListener('mouseup', (e) => endDrag(e.clientY));

    // Touch Events for Mobile
    pullContainer.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY));
    window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientY));
    window.addEventListener('touchend', (e) => endDrag(e.changedTouches[0].clientY));
  </script>
</body>
</html>
