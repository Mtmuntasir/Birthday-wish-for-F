<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Birthday Wish</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f7e3d0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card-container {
      width: 100%;
      max-width: 450px;
      min-height: 550px;
      background: linear-gradient(135deg, #fff0ed 0%, #ffdada 100%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .sub-text {
      position: absolute;
      top: 20px;
      font-size: 0.9rem;
      color: #a88a8a;
      font-style: italic;
    }

    .interactive-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .interactive-wrapper:active {
      cursor: grabbing;
    }

    .heart {
      font-size: 4rem;
      filter: drop-shadow(0 4px 10px rgba(230, 80, 100, 0.4));
      animation: pulse 1.5s infinite;
    }

    /* Arrow Style */
    .arrow-down {
      font-size: 1.5rem;
      color: #e64c65;
      margin: 4px 0;
      animation: bounce 1.2s infinite;
    }

    .pull-instruction {
      margin-top: 5px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #b07070;
      font-weight: 600;
    }

    .wish-content {
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .wish-content.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .make-wish {
      font-size: 0.85rem;
      color: #b07070;
      font-style: italic;
    }

    .title {
      font-size: 2.2rem;
      color: #d6335c;
      margin: 5px 0;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #7d5050;
      margin-bottom: 15px;
    }

    #treeCanvas {
      max-width: 100%;
      height: auto;
    }

    .date-badge {
      margin-top: 15px;
      padding: 6px 16px;
      background-color: #ffffff90;
      border: 1px solid #ffb6c1;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #d6335c;
      font-weight: 600;
      letter-spacing: 1px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="sub-text">a little something, for you</div>

    <!-- Heart & Arrow Interactive Element -->
    <div class="interactive-wrapper" id="heartWrapper">
      <div class="heart" id="pullHeart">❤️</div>
      <div class="arrow-down">↓</div>
      <span class="pull-instruction">PULL & RELEASE</span>
    </div>

    <!-- Wish Content (Initially Hidden) -->
    <div class="wish-content" id="wishContent">
      <div class="make-wish">make a wish...</div>
      <h1 class="title">Happy Birthday</h1>
      <p class="subtitle">to someone worth celebrating</p>
      
      <!-- Canvas for Tree Animation -->
      <canvas id="treeCanvas" width="400" height="300"></canvas>
      
      <div class="date-badge">27 • 11 • 2010</div>
    </div>
  </div>

  <script>
    const heartWrapper = document.getElementById('heartWrapper');
    const wishContent = document.getElementById('wishContent');
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    let isDragging = false;
    let startY = 0;

    // Pull down gesture detection
    heartWrapper.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaY = e.clientY - startY;
      if (deltaY > 0 && deltaY < 120) {
        heartWrapper.style.transform = `translateY(${deltaY}px)`;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const deltaY = e.clientY - startY;
      
      if (deltaY > 50) {
        heartWrapper.style.opacity = '0';
        setTimeout(() => {
          heartWrapper.style.display = 'none';
          wishContent.classList.add('show');
          growTree();
        }, 300);
      } else {
        heartWrapper.style.transform = 'translateY(0px)';
      }
    });

    // Canvas Tree Animation
    function drawTree(startX, startY, len, angle, branchWidth) {
      ctx.beginPath();
      ctx.save();
      ctx.strokeStyle = '#5a3d31';
      ctx.lineWidth = branchWidth;
      ctx.translate(startX, startY);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len);
      ctx.stroke();

      if (len < 10) {
        // Draw leaf hearts
        ctx.beginPath();
        ctx.arc(0, -len, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#e64c65';
        ctx.fill();
        ctx.restore();
        return;
      }

      setTimeout(() => {
        drawTree(0, -len, len * 0.75, angle + 15, branchWidth * 0.7);
        drawTree(0, -len, len * 0.75, angle - 15, branchWidth * 0.7);
      }, 50);

      ctx.restore();
    }

    function growTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTree(200, 280, 60, 0, 8);
    }
  </script>
</body>
</html>
